{% extends 'main/base.html' %}
{% load static %}

{% block content %}
<style>
    body {
        background-color: #f8f9fa; /* Light gray background */
        font-family: 'Arial', sans-serif;
    }

    .visualization-container {
        padding: 20px;
    }

    .charts-section {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 20px; /* Space between charts */
    }

    .chart-card {
        background: #ffffff; /* White background for cards */
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        padding: 20px;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .chart-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
    }

    .chart-card h4 {
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 15px;
        color: #333333;
    }

    .dropdown-container {
        margin-bottom: 30px;
        text-align: center;
    }

    .dropdown-container label {
        font-weight: 600;
        margin-right: 10px;
        color: #555555;
    }

    .dropdown-container select {
        padding: 8px 12px;
        border-radius: 5px;
        border: 1px solid #cccccc;
        background-color: #ffffff;
        font-size: 14px;
        color: #333333;
        cursor: pointer;
    }

    .dropdown-container select:hover {
        border-color: #999999;
    }

    .dropdown-container select:focus {
        outline: none;
        border-color: #007bff;
        box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.25);
    }
</style>

<div class="container-fluid page-body-wrapper">
    <div class="main-panel">
        <div class="content-wrapper">
            <!-- Dropdown for Class Selection -->
            <div class="dropdown-container">
                <label for="class-select">Select Class:</label>
                <select id="class-select">
                    {% for class in class_names %}
                        <option value="{{ class }}">{{ class }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Charts Section -->
            <div class="charts-section">
                <!-- Stacked Bar Chart -->
                <div class="chart-card">
                    <h4>Students Distribution by Gender and Class</h4>
                    <canvas id="stackedBarChart"></canvas>
                </div>

                <!-- Pie Chart - Gender Distribution -->
                <div class="chart-card">
                    <h4>Gender Distribution</h4>
                    <canvas id="genderDistributionChart"></canvas>
                </div>

                <!-- Doughnut Chart - Day Students vs Boarders -->
                <div class="chart-card">
                    <h4>Day Students vs Boarders</h4>
                    <canvas id="residencyDistributionChart"></canvas>
                </div>

                <!-- Pie Chart - Male Day Students vs Male Boarders -->
                <div class="chart-card">
                    <h4>Male Students: Day vs Boarders</h4>
                    <canvas id="maleResidencyChart"></canvas>
                </div>

                <!-- Pie Chart - Female Day Students vs Female Boarders -->
                <div class="chart-card">
                    <h4>Female Students: Day vs Boarders</h4>
                    <canvas id="femaleResidencyChart"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- If using CDN -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
    // Function to calculate percentages
    function calculatePercentages(counts) {
        const total = counts.reduce((sum, count) => sum + count, 0);
        return counts.map(count => ((count / total) * 100).toFixed(2));
    }

    // Data for all classes (passed from the backend)
    const classData = {
        {% for class in class_names %}
            "{{ class }}": {
                male_students: {{ male_student_counts|safe }}[{{ forloop.counter0 }}],
                female_students: {{ female_student_counts|safe }}[{{ forloop.counter0 }}],
                gender_counts: [{{ gender_counts|safe }}[{{ forloop.counter0 }}][0], {{ gender_counts|safe }}[{{ forloop.counter0 }}][1]],
                residency_counts: [{{ residency_counts|safe }}[{{ forloop.counter0 }}][0], {{ residency_counts|safe }}[{{ forloop.counter0 }}][1]],
                male_day_students: {{ male_day_students|safe }}[{{ forloop.counter0 }}],
                male_boarders: {{ male_boarders|safe }}[{{ forloop.counter0 }}],
                female_day_students: {{ female_day_students|safe }}[{{ forloop.counter0 }}],
                female_boarders: {{ female_boarders|safe }}[{{ forloop.counter0 }}]
            },
        {% endfor %}
    };

    let stackedBarChart, genderDistributionChart, residencyDistributionChart, maleResidencyChart, femaleResidencyChart;

    function initializeCharts(selectedClass) {
        const data = classData[selectedClass];

        // Calculate percentages
        const genderPercentages = calculatePercentages(data.gender_counts);
        const residencyPercentages = calculatePercentages(data.residency_counts);
        const maleResidencyPercentages = calculatePercentages([data.male_day_students, data.male_boarders]);
        const femaleResidencyPercentages = calculatePercentages([data.female_day_students, data.female_boarders]);

        // Stacked Bar Chart (unchanged, uses actual numbers)
        const ctx1 = document.getElementById('stackedBarChart').getContext('2d');
        if (stackedBarChart) stackedBarChart.destroy();
        stackedBarChart = new Chart(ctx1, {
            type: 'bar',
            data: {
                labels: [selectedClass],
                datasets: [
                    {
                        label: 'Male Students',
                        data: [data.male_students],
                        backgroundColor: 'rgba(54, 162, 235, 0.5)',
                        borderColor: 'rgba(54, 162, 235, 1)',
                        borderWidth: 1
                    },
                    {
                        label: 'Female Students',
                        data: [data.female_students],
                        backgroundColor: 'rgba(255, 99, 132, 0.5)',
                        borderColor: 'rgba(255, 99, 132, 1)',
                        borderWidth: 1
                    }
                ]
            },
            options: {
                scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true } },
                plugins: { legend: { position: 'top' } }
            }
        });

        // Pie Chart - Gender Distribution (percentages)
        const ctx2 = document.getElementById('genderDistributionChart').getContext('2d');
        if (genderDistributionChart) genderDistributionChart.destroy();
        genderDistributionChart = new Chart(ctx2, {
            type: 'pie',
            data: {
                labels: ['Male', 'Female'],
                datasets: [{
                    data: genderPercentages,
                    backgroundColor: ['rgba(54, 162, 235, 0.2)', 'rgba(255, 99, 132, 0.2)'],
                    borderColor: ['rgba(54, 162, 235, 1)', 'rgba(255, 99, 132, 1)'],
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { position: 'top' },
                    tooltip: {
                        callbacks: {
                            label: (context) => `${context.label}: ${context.raw}%`
                        }
                    }
                }
            }
        });

        // Doughnut Chart - Day Students vs Boarders (percentages)
        const ctx3 = document.getElementById('residencyDistributionChart').getContext('2d');
        if (residencyDistributionChart) residencyDistributionChart.destroy();
        residencyDistributionChart = new Chart(ctx3, {
            type: 'doughnut',
            data: {
                labels: ['Day Students', 'Boarders'],
                datasets: [{
                    data: residencyPercentages,
                    backgroundColor: ['rgba(255, 206, 86, 0.2)', 'rgba(75, 192, 192, 0.2)'],
                    borderColor: ['rgba(255, 206, 86, 1)', 'rgba(75, 192, 192, 1)'],
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { position: 'top' },
                    tooltip: {
                        callbacks: {
                            label: (context) => `${context.label}: ${context.raw}%`
                        }
                    }
                }
            }
        });

        // Pie Chart - Male Day Students vs Male Boarders (percentages)
        const ctx4 = document.getElementById('maleResidencyChart').getContext('2d');
        if (maleResidencyChart) maleResidencyChart.destroy();
        maleResidencyChart = new Chart(ctx4, {
            type: 'pie',
            data: {
                labels: ['Day Students', 'Boarders'],
                datasets: [{
                    data: maleResidencyPercentages,
                    backgroundColor: ['rgba(54, 162, 235, 0.2)', 'rgba(75, 192, 192, 0.2)'],
                    borderColor: ['rgba(54, 162, 235, 1)', 'rgba(75, 192, 192, 1)'],
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { position: 'top' },
                    tooltip: {
                        callbacks: {
                            label: (context) => `${context.label}: ${context.raw}%`
                        }
                    }
                }
            }
        });

        // Pie Chart - Female Day Students vs Female Boarders (percentages)
        const ctx5 = document.getElementById('femaleResidencyChart').getContext('2d');
        if (femaleResidencyChart) femaleResidencyChart.destroy();
        femaleResidencyChart = new Chart(ctx5, {
            type: 'pie',
            data: {
                labels: ['Day Students', 'Boarders'],
                datasets: [{
                    data: femaleResidencyPercentages,
                    backgroundColor: ['rgba(255, 99, 132, 0.2)', 'rgba(255, 159, 64, 0.2)'],
                    borderColor: ['rgba(255, 99, 132, 1)', 'rgba(255, 159, 64, 1)'],
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { position: 'top' },
                    tooltip: {
                        callbacks: {
                            label: (context) => `${context.label}: ${context.raw}%`
                        }
                    }
                }
            }
        });
    }

    // Initialize charts with the first class by default
    initializeCharts(document.getElementById('class-select').value);

    // Handle dropdown change event
    document.getElementById('class-select').addEventListener('change', function() {
        initializeCharts(this.value);
    });
</script>
{% endblock %}
