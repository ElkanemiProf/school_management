{% extends 'main/base.html' %}
{% load static %}

{% block content %}
<style>
    body {
        background-color: #d0e6f1; /* Light blue background */
    }

    .visualization-container {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
    }

    .charts-section {
        width: 100%; /* Full width for the charts container */
        display: flex;
        flex-wrap: wrap;
        gap: 20px; /* Add space between charts */
    }

    .chart-card {
        flex: 1; /* Each chart will take equal space */
        min-width: 300px; /* Minimum width for each chart */
    }

    .dropdown-container {
        margin-bottom: 20px;
    }

    .dropdown-container label {
        font-weight: bold;
        margin-right: 10px;
    }

    .dropdown-container select {
        padding: 5px;
        border-radius: 5px;
        border: 1px solid #ccc;
    }
</style>

<div class="container-fluid page-body-wrapper">
    <div class="main-panel">
        <div class="content-wrapper">
            <!-- Dropdown for Class Selection -->
            <div class="dropdown-container">
                <label for="class-select">Select Class:</label>
                <select id="class-select">
                    {% for class in class_names %}
                        <option value="{{ class }}">{{ class }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Charts Section -->
            <div class="charts-section">
                <!-- Stacked Bar Chart -->
                <div class="chart-card">
                    <div class="card">
                        <div class="card-body">
                            <h4 class="card-title">Students Distribution by Gender and Class</h4>
                            <canvas id="stackedBarChart"></canvas>
                        </div>
                    </div>
                </div>

                <!-- Pie Chart - Gender Distribution -->
                <div class="chart-card">
                    <div class="card">
                        <div class="card-body">
                            <h4 class="card-title">Gender Distribution</h4>
                            <canvas id="genderDistributionChart"></canvas>
                        </div>
                    </div>
                </div>

                <!-- Doughnut Chart - Day Students vs Boarders -->
                <div class="chart-card">
                    <div class="card">
                        <div class="card-body">
                            <h4 class="card-title">Day Students vs Boarders</h4>
                            <canvas id="residencyDistributionChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- If using CDN -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
    // Data for all classes (passed from the backend)
    const classData = {
        {% for class in class_names %}
            "{{ class }}": {
                male_students: {{ male_student_counts|safe }}[{{ forloop.counter0 }}],
                female_students: {{ female_student_counts|safe }}[{{ forloop.counter0 }}],
                gender_counts: [{{ gender_counts|safe }}[{{ forloop.counter0 }}][0], {{ gender_counts|safe }}[{{ forloop.counter0 }}][1]],
                residency_counts: [{{ residency_counts|safe }}[{{ forloop.counter0 }}][0], {{ residency_counts|safe }}[{{ forloop.counter0 }}][1]]
            },
        {% endfor %}
    };

    let stackedBarChart, genderDistributionChart, residencyDistributionChart;

    function initializeCharts(selectedClass) {
        const data = classData[selectedClass];

        // Stacked Bar Chart
        const ctx1 = document.getElementById('stackedBarChart').getContext('2d');
        if (stackedBarChart) stackedBarChart.destroy();
        stackedBarChart = new Chart(ctx1, {
            type: 'bar',
            data: {
                labels: [selectedClass],
                datasets: [
                    {
                        label: 'Male Students',
                        data: [data.male_students],
                        backgroundColor: 'rgba(54, 162, 235, 0.5)',
                        borderColor: 'rgba(54, 162, 235, 1)',
                        borderWidth: 1
                    },
                    {
                        label: 'Female Students',
                        data: [data.female_students],
                        backgroundColor: 'rgba(255, 99, 132, 0.5)',
                        borderColor: 'rgba(255, 99, 132, 1)',
                        borderWidth: 1
                    }
                ]
            },
            options: {
                scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true } },
                plugins: { legend: { position: 'top' } }
            }
        });

        // Pie Chart - Gender Distribution
        const ctx2 = document.getElementById('genderDistributionChart').getContext('2d');
        if (genderDistributionChart) genderDistributionChart.destroy();
        genderDistributionChart = new Chart(ctx2, {
            type: 'pie',
            data: {
                labels: ['Male', 'Female'],
                datasets: [{
                    data: data.gender_counts,
                    backgroundColor: ['rgba(54, 162, 235, 0.2)', 'rgba(255, 99, 132, 0.2)'],
                    borderColor: ['rgba(54, 162, 235, 1)', 'rgba(255, 99, 132, 1)'],
                    borderWidth: 1
                }]
            },
            options: { responsive: true, plugins: { legend: { position: 'top' } } }
        });

        // Doughnut Chart - Day Students vs Boarders
        const ctx3 = document.getElementById('residencyDistributionChart').getContext('2d');
        if (residencyDistributionChart) residencyDistributionChart.destroy();
        residencyDistributionChart = new Chart(ctx3, {
            type: 'doughnut',
            data: {
                labels: ['Day Students', 'Boarders'],
                datasets: [{
                    data: data.residency_counts,
                    backgroundColor: ['rgba(255, 206, 86, 0.2)', 'rgba(75, 192, 192, 0.2)'],
                    borderColor: ['rgba(255, 206, 86, 1)', 'rgba(75, 192, 192, 1)'],
                    borderWidth: 1
                }]
            },
            options: { responsive: true, plugins: { legend: { position: 'top' } } }
        });
    }

    // Initialize charts with the first class by default
    initializeCharts(document.getElementById('class-select').value);

    // Handle dropdown change event
    document.getElementById('class-select').addEventListener('change', function() {
        initializeCharts(this.value);
    });
</script>
{% endblock %}
