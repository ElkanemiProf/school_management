{% extends 'main/base.html' %}
{% load static %}

{% block title %}Modify Subject{% endblock %}

{% block content %}
<style>
    body {
        background-color: #f8f9fa;
        font-family: 'Arial', sans-serif;
    }

    .form-container {
        max-width: 700px;
        margin: 20px auto;
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
    }

    .form-container h2 {
        text-align: center;
        margin-bottom: 20px;
    }

    .form-group {
        margin-bottom: 15px;
    }

    label {
        font-weight: bold;
    }

    select, input, textarea {
        width: 100%;
        padding: 8px;
        margin-top: 5px;
        border: 1px solid #ccc;
        border-radius: 5px;
    }

    .btn-container {
        text-align: center;
    }

    .btn-primary {
        background-color: #007bff;
        color: white;
        border: none;
        padding: 10px 15px;
        border-radius: 5px;
        cursor: pointer;
    }

    .btn-primary:hover {
        background-color: #0056b3;
    }
</style>

<div class="form-container">
    <h2>Modify Subject: {{ subject.name }}</h2>

    <!-- Display the form -->
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save Changes</button>
</form>

<!-- Example link to update teachers -->
<a href="{% url 'update_teachers_ajax' subject_id=subject.id %}">Update Teachers</a>

<!-- Example JavaScript for AJAX request -->
<script>
    const subjectId = {{ subject.id }};
    const updateTeachersUrl = "{% url 'update_teachers_ajax' subject_id=subject.id %}";

    console.log("Subject ID:", subjectId);  // Debugging
    console.log("Update Teachers URL:", updateTeachersUrl);  // Debugging

    // Example AJAX request
    fetch(updateTeachersUrl, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': '{{ csrf_token }}',  // Add CSRF token for security
        },
        body: JSON.stringify({ teacher_ids: [1, 2, 3] }),  // Replace with actual teacher IDs
    })
    .then(response => response.json())
    .then(data => console.log(data))
    .catch(error => console.error(error));
</script>
</div>

{% endblock %}
